[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "replication-manager"
version = "0.2.0"
description = "A replication workflow for comparing papers against reproduced outputs with DAG execution, image hashing, and structured PDF extraction."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Hao" }
]
dependencies = [
  "jinja2>=3.1.0",
  "pypdfium2>=4.30.0",
]

[project.optional-dependencies]
pdf = ["pdfplumber>=0.10.0"]
image = ["imagehash>=4.3.0", "Pillow>=10.0.0"]
figures = ["matplotlib>=3.8.0", "openpyxl>=3.1.0"]
word = ["python-docx>=1.1.0"]
export = ["weasyprint>=62.0", "python-docx>=1.1.0"]
all = [
  "pdfplumber>=0.10.0",
  "imagehash>=4.3.0",
  "Pillow>=10.0.0",
  "matplotlib>=3.8.0",
  "openpyxl>=3.1.0",
  "weasyprint>=62.0",
  "python-docx>=1.1.0",
]

[project.scripts]
replication-manager = "replication_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
