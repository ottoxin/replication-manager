<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="'Segoe UI',system-ui,sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <linearGradient id="phaseA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/><stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="phaseB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/><stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="phaseC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d1fae5"/><stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="680" rx="16" fill="#f8fafc"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Replication Manager — System Flowchart</text>

  <!-- Phase A box -->
  <rect x="20" y="56" width="860" height="240" rx="12" fill="url(#phaseA)" stroke="#93c5fd" stroke-width="1.5" opacity="0.6"/>
  <text x="40" y="78" font-size="14" font-weight="700" fill="#1e40af">Phase A: Acquisition &amp; Screening</text>
  <text x="860" y="78" text-anchor="end" font-size="11" fill="#3b82f6" font-style="italic">Coordinator + Executor</text>

  <!-- Phase A nodes -->
  <g filter="url(#shadow)">
    <!-- Inputs -->
    <rect x="40" y="96" width="120" height="52" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="100" y="118" text-anchor="middle" font-weight="600" fill="#1e40af">Paper</text>
    <text x="100" y="134" text-anchor="middle" font-size="11" fill="#64748b">PDF / HTML / text</text>

    <rect x="40" y="164" width="120" height="52" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="100" y="186" text-anchor="middle" font-weight="600" fill="#1e40af">Package</text>
    <text x="100" y="202" text-anchor="middle" font-size="11" fill="#64748b">ZIP / dir / GitHub</text>

    <!-- Intake -->
    <rect x="210" y="96" width="130" height="52" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="275" y="118" text-anchor="middle" font-weight="600" fill="#1e293b">Intake Sources</text>
    <text x="275" y="134" text-anchor="middle" font-size="11" fill="#64748b">materialize inputs</text>

    <!-- Profile Paper -->
    <rect x="210" y="164" width="130" height="52" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="275" y="186" text-anchor="middle" font-weight="600" fill="#1e293b">Profile Paper</text>
    <text x="275" y="202" text-anchor="middle" font-size="11" fill="#64748b">tables, figures, claims</text>

    <!-- Inspect -->
    <rect x="390" y="96" width="130" height="52" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="455" y="118" text-anchor="middle" font-weight="600" fill="#1e293b">Inspect Package</text>
    <text x="455" y="134" text-anchor="middle" font-size="11" fill="#64748b">scripts, artifacts, env</text>

    <!-- Screen -->
    <rect x="390" y="164" width="130" height="52" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="455" y="186" text-anchor="middle" font-weight="600" fill="#1e293b">Screen Package</text>
    <text x="455" y="202" text-anchor="middle" font-size="11" fill="#64748b">GPU/heavy/viz detection</text>

    <!-- Sandbox -->
    <rect x="570" y="96" width="130" height="52" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="635" y="118" text-anchor="middle" font-weight="600" fill="#1e293b">Prepare Sandbox</text>
    <text x="635" y="134" text-anchor="middle" font-size="11" fill="#64748b">venv, deps, isolation</text>

    <!-- Execute -->
    <rect x="570" y="164" width="130" height="52" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="635" y="186" text-anchor="middle" font-weight="600" fill="#1e293b">Execute Scripts</text>
    <text x="635" y="202" text-anchor="middle" font-size="11" fill="#64748b">DAG-ordered run</text>

    <!-- Screening report -->
    <rect x="750" y="120" width="120" height="52" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="810" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#3b82f6">Screening Report</text>
    <text x="810" y="158" text-anchor="middle" font-size="10" fill="#64748b">feasibility + viz check</text>

    <!-- skip-heavy decision -->
    <polygon points="635,232 665,256 635,280 605,256" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="635" y="260" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">skip?</text>
  </g>

  <!-- Phase A arrows -->
  <line x1="160" y1="122" x2="207" y2="122" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="160" y1="190" x2="207" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="122" x2="387" y2="122" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="275" y1="148" x2="275" y2="161" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="455" y1="148" x2="455" y2="161" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="122" x2="567" y2="122" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="635" y1="148" x2="635" y2="161" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="190" x2="567" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="146" x2="747" y2="146" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="635" y1="216" x2="635" y2="229" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase B box -->
  <rect x="20" y="308" width="860" height="140" rx="12" fill="url(#phaseB)" stroke="#fbbf24" stroke-width="1.5" opacity="0.6"/>
  <text x="40" y="330" font-size="14" font-weight="700" fill="#92400e">Phase B: Verification &amp; Analysis</text>
  <text x="860" y="330" text-anchor="end" font-size="11" fill="#d97706" font-style="italic">Reporter + Analyst</text>

  <!-- Phase B nodes -->
  <g filter="url(#shadow)">
    <rect x="40" y="348" width="160" height="52" rx="8" fill="#fff" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="120" y="370" text-anchor="middle" font-weight="600" fill="#1e293b">Diagnose Execution</text>
    <text x="120" y="386" text-anchor="middle" font-size="11" fill="#64748b">env gaps, blockers</text>

    <rect x="240" y="348" width="160" height="52" rx="8" fill="#fff" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="320" y="370" text-anchor="middle" font-weight="600" fill="#1e293b">Match Outputs</text>
    <text x="320" y="386" text-anchor="middle" font-size="11" fill="#64748b">numeric + figure + table</text>

    <rect x="440" y="348" width="160" height="52" rx="8" fill="#fff" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="520" y="370" text-anchor="middle" font-weight="600" fill="#1e293b">Analyze Results</text>
    <text x="520" y="386" text-anchor="middle" font-size="11" fill="#64748b">filter coincidental, verdict</text>

    <!-- Analysis output -->
    <rect x="660" y="348" width="140" height="52" rx="8" fill="#fefce8" stroke="#fbbf24" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="730" y="366" text-anchor="middle" font-size="11" font-weight="600" fill="#d97706">Adjusted Verdict</text>
    <text x="730" y="382" text-anchor="middle" font-size="10" fill="#64748b">substantive rate, figs</text>
    <text x="730" y="394" text-anchor="middle" font-size="10" fill="#64748b">claim classifications</text>
  </g>

  <!-- Phase B arrows -->
  <line x1="200" y1="374" x2="237" y2="374" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="374" x2="437" y2="374" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="374" x2="657" y2="374" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- A to B arrow -->
  <path d="M 120 296 L 120 345" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase C box -->
  <rect x="20" y="462" width="860" height="130" rx="12" fill="url(#phaseC)" stroke="#6ee7b7" stroke-width="1.5" opacity="0.6"/>
  <text x="40" y="484" font-size="14" font-weight="700" fill="#065f46">Phase C: Reporting</text>
  <text x="860" y="484" text-anchor="end" font-size="11" fill="#059669" font-style="italic">Reporter</text>

  <!-- Phase C nodes -->
  <g filter="url(#shadow)">
    <rect x="40" y="500" width="160" height="52" rx="8" fill="#fff" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="120" y="522" text-anchor="middle" font-weight="600" fill="#1e293b">Write Report</text>
    <text x="120" y="538" text-anchor="middle" font-size="11" fill="#64748b">HTML + Markdown</text>

    <rect x="260" y="500" width="150" height="52" rx="8" fill="#fff" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="335" y="518" text-anchor="middle" font-weight="600" fill="#1e293b">Figure Comparison</text>
    <text x="335" y="534" text-anchor="middle" font-size="11" fill="#64748b">paper vs artifact side-by-side</text>

    <rect x="470" y="500" width="150" height="52" rx="8" fill="#fff" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="545" y="518" text-anchor="middle" font-weight="600" fill="#1e293b">Numeric Table</text>
    <text x="545" y="534" text-anchor="middle" font-size="11" fill="#64748b">substantive vs coincidental</text>

    <!-- Output artifacts -->
    <rect x="680" y="494" width="180" height="64" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="770" y="512" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">Outputs</text>
    <text x="770" y="528" text-anchor="middle" font-size="10" fill="#64748b">report.html  report.md</text>
    <text x="770" y="542" text-anchor="middle" font-size="10" fill="#64748b">summary.json  analysis.json</text>
  </g>

  <!-- Phase C arrows -->
  <line x1="200" y1="526" x2="257" y2="526" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="526" x2="467" y2="526" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="526" x2="677" y2="526" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- B to C arrow -->
  <path d="M 120 400 L 120 497" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <g transform="translate(40,610)">
    <rect width="820" height="50" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
    <rect x="16" y="16" width="16" height="16" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="40" y="28" font-size="11" fill="#475569">Phase A: Acquisition</text>
    <rect x="176" y="16" width="16" height="16" rx="4" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="200" y="28" font-size="11" fill="#475569">Phase B: Verification</text>
    <rect x="346" y="16" width="16" height="16" rx="4" fill="#d1fae5" stroke="#6ee7b7"/>
    <text x="370" y="28" font-size="11" fill="#475569">Phase C: Reporting</text>
    <rect x="506" y="16" width="16" height="16" rx="4" fill="#fff" stroke="#94a3b8" stroke-dasharray="4,2"/>
    <text x="530" y="28" font-size="11" fill="#475569">Artifact / Output</text>
    <polygon points="680,24 692,17 692,31" fill="#475569"/>
    <text x="700" y="28" font-size="11" fill="#475569">Data flow</text>
  </g>
</svg>
